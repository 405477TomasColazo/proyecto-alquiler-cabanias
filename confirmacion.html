<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .confirmation-card {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
        }
        .reservation-details {
            margin-top: 20px;
        }
        .reservation-details p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Cabañas del Bosque</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link btn btn-danger text-white" href="login.html">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card confirmation-card shadow">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Confirmación de Reserva</h2>
                <div id="confirmationDetails" class="reservation-details">
                    <!-- Los detalles se cargarán dinámicamente -->
                </div>
                <div class="text-center mt-4">
                    <a href="index.html" class="btn btn-primary">Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            const reservaData = JSON.parse(localStorage.getItem('ultimaReserva'));
            if (reservaData) {
                document.getElementById('confirmationDetails').innerHTML = `
                    <p><strong>Email:</strong> ${localStorage.getItem('email')}</p>
                    <p><strong>Tipo de Cabaña:</strong> ${reservaData.tipoCabaña}</p>
                    <p><strong>Fecha de Inicio:</strong> ${reservaData.fechaInicio}</p>
                    <p><strong>Fecha de Fin:</strong> ${reservaData.fechaFin}</p>
                    <p><strong>Cantidad de Personas:</strong> ${reservaData.personas}</p>
                    <p><strong>Precio Total:</strong> $${reservaData.precioTotal}</p>
                `;
            } else {
                document.getElementById('confirmationDetails').innerHTML = `
                    <p class="text-center">No se encontró información de la reserva.</p>
                `;
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
