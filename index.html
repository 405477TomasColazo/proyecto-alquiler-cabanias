<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Cabañas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Cabañas del Bosque</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#reservas">Reservas</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-danger text-white" href="login.html">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="hero text-center">
        Reserva tu cabaña ideal en plena naturaleza
    </div>
    
    <div class="container mt-5" id="reservas">
        <h2 class="text-center mb-4">Encuentra la mejor opción para ti</h2>
        <form id="reservaForm" class="w-75 mx-auto bg-white p-4 shadow-custom rounded">
            <div class="mb-3">
                <label for="tipoCabaña" class="form-label">Tipo de Cabaña</label>
                <select class="form-select" id="tipoCabaña">
                    <option value="estandar">Estándar</option>
                    <option value="premium">Premium</option>
                    <option value="deluxe">Deluxe</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="fechaInicio" class="form-label">Fecha de Inicio</label>
                <input type="date" class="form-control" id="fechaInicio" required>
                <div id="fechaInicioError" class="text-danger"></div>
            </div>
            <div class="mb-3">
                <label for="fechaFin" class="form-label">Fecha de Fin</label>
                <input type="date" class="form-control" id="fechaFin" required>
                <div id="fechaFinError" class="text-danger"></div>
            </div>
            <div class="mb-3">
                <label for="personas" class="form-label">Cantidad de Personas</label>
                <input type="number" class="form-control" id="personas" required>
                <div id="personasError" class="text-danger"></div>
            </div>
            <div class="mb-3 text-center">
                <h4>Precio estimado: $<span id="precio">0</span></h4>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reservar Ahora</button>
        </form>
    </div>
    
    <!-- Modal -->
    <div id="alquilerModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reserva Confirmada</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <h4>¡Gracias por tu reserva!</h4>
                    <p>Tu cabaña ha sido reservada exitosamente.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
